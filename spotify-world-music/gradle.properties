# Paper/Spigot plugin build properties.
# The plugin only touches the Bukkit API surface, so the jar runs on Spigot,
# Paper, Purpur and forks alike; Paper's artifact is used at compile time
# because it is the one published to a public Maven repo.

org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false

minecraft_version=1.21.1
paper_version=1.21.1-R0.1-SNAPSHOT
java_version=21

plugin_id=SpotifyWorldMusic
plugin_name=SpotifyWorldMusic
plugin_version=1.0.0
plugin_group_id=com.pokewing.swm
plugin_authors=pokewing
