name: Youer build

on:
  push:
    branches: ['**']
    paths:
      - 'youer/**'
      - '.github/workflows/youer-build.yml'
  pull_request:
    paths:
      - 'youer/**'
      - '.github/workflows/youer-build.yml'
  workflow_dispatch:

concurrency:
  group: youer-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # gradle.properties asks for JDK 25, and gradle/gradle-daemon-jvm.properties pins the daemon to it.
  JAVA_VERSION: '25'

jobs:
  adventure-compat:
    name: Adventure legacy-hover compat
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Proves the ItemsAdder NoSuchMethodError is actually fixed: reproduces it against the stock
      # Adventure artifact, then shows the patched artifact accepting the same call.
      - name: Verify the compat patch
        working-directory: youer
        run: bash tools/adventure-compat-test/check.sh

  configure:
    name: Configure build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      # Compiles buildSrc and evaluates every build script — this is the step that used to fail with
      # "unnamed variables are a preview feature" when the daemon ran on JDK 21.
      - name: Evaluate build scripts
        working-directory: youer
        run: ./gradlew tasks --all --stacktrace

  server-jar:
    name: Server jar
    runs-on: ubuntu-latest
    # NeoForge decompiles and patches Minecraft from scratch on a cold cache.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # gradleutils reads git metadata to stamp the jar version.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Build
        working-directory: youer
        run: ./gradlew :neoforge:youerJar --stacktrace -Dorg.gradle.jvmargs=-Xmx6g

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: youer-server
          path: youer/projects/youer/build/libs/*.jar
          if-no-files-found: error
