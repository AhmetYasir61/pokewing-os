plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'java'
}

version = "${mod_version}"
group = "${mod_group_id}"

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

repositories {
    // Epic Fight is distributed on CurseForge/Modrinth. For local dev, drop the
    // Epic Fight jar into libs/ and it is picked up by the flatDir repo below.
    flatDir { dirs 'libs' }
    maven { url = 'https://cursemaven.com' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Epic Fight at COMPILE time only. Replace the name with the jar you place
    // in libs/, e.g. libs/epicfight-20.6.4.jar -> name: 'epicfight-20.6.4'.
    // If you use cursemaven instead, comment this out and use the maven line.
    compileOnly fg.deobf("blank:epicfight:${epicfight_version}")
    // compileOnly fg.deobf("curse.maven:epic-fight-405076:PROJECT_FILE_ID")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version, forge_version: forge_version,
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_authors: mod_authors, mod_license: mod_license,
        mod_group_id: mod_group_id
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
