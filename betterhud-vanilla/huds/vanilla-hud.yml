# =====================================================================
#  plugins/BetterHud/huds/vanilla-hud.yml
#
#  KOORDINAT SISTEMI (jar'dan dogrulandi)
#
#  gui.x / gui.y  -> 0..100 arasi YUZDE.
#     Uretilen shader'da tam olarak sunu yapar:
#         xGui = ui.x * <gui.x> / 100.0;
#         yGui = ui.y * <gui.y> / 100.0;
#     'ui' = GUI uzayindaki ekran boyutu. Yani deger cozunurluge degil
#     orana bagli.
#         y: 0   -> ust kenar
#         y: 100 -> alt kenar
#         x: 0   -> sol kenar
#         x: 100 -> sag kenar
#
#  pixel.x / pixel.y -> o noktadan piksel ofset. GUI uzayinda
#     +y ASAGI, -y YUKARI  (shader'da pos.y += yGui).
#     Ornegin plugin'in kendi ornegi:  gui.y: 100 + pixel.y: -80
#     = alt kenardan 80 px yukari.  Ayni mantik burada da kullanildi.
#
#  Neden her GUI Scale'de calisir:
#  Yuzde ile capa atip pikselle ince ayar yaptigimiz icin panel, scale
#  1'de de 4'te de ekranin ayni oransal bolgesinde kalir. Scale 4'te
#  (cok buyuk arayuz) tasma olmamasi icin kenar bosluklarini genis
#  biraktim: hicbir panel ekranin %25'inden fazlasini kaplamaz.
# =====================================================================

vanilla_hud:

  layouts:

    # --- Scoreboard: sag kenar, dikey ortali -------------------------
    # Panel 11 satir * ~10 px = ~110 px. Merkezi %50'ye oturtmak icin
    # yarisi kadar (-55) yukari kaydiriliyor; satirlar oradan asagi
    # dogru diziliyor. Sag kenardan 4 px iceri.
    1:
      name: vanilla_scoreboard
      gui:   { x: 100, y: 50 }
      pixel: { x: -4, y: -55 }

    # --- Oyuncu listesi: sol ust -------------------------------------
    # Ust kenardan 12 px asagi (+y asagi).
    2:
      name: vanilla_playerlist
      gui:   { x: 0, y: 0 }
      pixel: { x: 4, y: 12 }

    # --- Durum satiri: hotbar'in hemen ustu, ortali ------------------
    # Alt kenardan 43 px yukari = hotbar + can/aclik satirinin ustu.
    # Vanilla HUD yerlesimi sabit oldugu icin bu ofset her scale'de
    # ayni yere denk gelir.
    3:
      name: vanilla_status
      gui:   { x: 50, y: 100 }
      pixel: { x: 0, y: -43 }

    # --- Para: sag ust kose ------------------------------------------
    4:
      name: vanilla_economy
      gui:   { x: 100, y: 0 }
      pixel: { x: -4, y: 12 }

  # Belirli dunyalarda gizlemek istersen:
