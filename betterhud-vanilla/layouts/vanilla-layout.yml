# =====================================================================
#  plugins/BetterHud/layouts/vanilla-layout.yml
#
#  Tum layout'lar SADECE 'texts:' kullanir. Ne 'images:' ne 'heads:' var
#  -> tek bir PNG bile gerekmez.
#
#  PLACEHOLDER YAZIMI
#    [xxx]        -> BetterHud'un dahili placeholder'i (name, world,
#                    level, health, food, armor ...)
#    [papi:xxx]   -> PlaceholderAPI. Yuzde isaretleri OLMADAN yazilir.
#                    Ornek:  %vault_eco_balance_formatted%
#                        ->  [papi:vault_eco_balance_formatted]
#
#    Dogrudan '%xxx%' yazarsan BetterHud onu hic islemez ve ekrana ham
#    '%xxx%' basar. papi, plugin icinde string container'a
#    requiredArgsLength(1) ile kayitli -- yani tek argumani var ve o da
#    koseli parantez icinde ':' sonrasina yazilir.
#
#  KOORDINAT YAZIMI
#  Her girdinin x / y degeri DOGRUDAN girdinin kokunde durur -- tipki
#  plugin'in kendi 'health' / 'hunger' layout'larindaki gibi.
#  'loc:' diye bir alt-anahtar YOKTUR; acarsan degerler yok sayilir ve
#  butun satirlar y=0'da ust uste biner.
#
#  Y YONU:  +y ASAGI, -y YUKARI.
#  Satirlar 0, 10, 22, 32 ... diye ARTARAK gider.
#  10 px aralik, texts/vanilla-font.yml'deki 'scale: 8' ile birlikte
#  vanilla satir ritmini verir (8 px glyph + 2 px bosluk). Font
#  scale'ini degistirirsen bu araliklari da olceklemen gerekir.
#
#  Alanlar:
#    align   : metnin kendi hizalamasi (LEFT / CENTER / RIGHT)
#    offset  : layout grubunun cikis yonu (LEFT / CENTER / RIGHT)
#    name    : kullanilacak font (texts/ icindeki tanim)
# =====================================================================


# ---------------------------------------------------------------------
#  1) SCOREBOARD PANELI  (sag kenar, vanilla sidebar gorunumu)
# ---------------------------------------------------------------------
vanilla_scoreboard:
  offset: RIGHT
  align: RIGHT
  texts:
    1:
      name: vanilla_font
      pattern: '<yellow><bold>POKEWING'
      align: RIGHT
      x: 0
      y: 0
    2:
      name: vanilla_font
      pattern: '<dark_gray>-----------------'
      align: RIGHT
      x: 0
      y: 10
    3:
      name: vanilla_font
      pattern: '<gray>Oyuncu <white>[name]'
      align: RIGHT
      x: 0
      y: 22
    4:
      name: vanilla_font
      pattern: '<gray>Dunya <white>[world]'
      align: RIGHT
      x: 0
      y: 32
    5:
      name: vanilla_font
      pattern: '<gray>Seviye <white>[level]'
      align: RIGHT
      x: 0
      y: 42
    6:
      name: vanilla_font
      pattern: '<dark_gray>-----------------'
      align: RIGHT
      x: 0
      y: 54
    # Vault'un dahili [money] placeholder'i bu sunucuda calismiyor,
    # onun yerine PAPI'nin vault surumu kullanildi.
    7:
      name: vanilla_font
      pattern: '<gray>Para <green>$[papi:vault_eco_balance_formatted]'
      align: RIGHT
      x: 0
      y: 66
    # Sunucudaki GERCEK online oyuncu sayisi.
    8:
      name: vanilla_font
      pattern: '<gray>Online <green>[papi:server_online]<dark_gray>/<green>[papi:server_max_players]'
      align: RIGHT
      x: 0
      y: 76
    9:
      name: vanilla_font
      pattern: '<gray>Ping <green>[papi:player_ping]<dark_gray>ms'
      align: RIGHT
      x: 0
      y: 86
    10:
      name: vanilla_font
      pattern: '<dark_gray>-----------------'
      align: RIGHT
      x: 0
      y: 98
    11:
      name: vanilla_font
      pattern: '<yellow>play.pokewing.net'
      align: RIGHT
      x: 0
      y: 110


# ---------------------------------------------------------------------
#  2) OYUNCU LISTESI PANELI  (sol ust)
#
#     BetterHud'un dahili placeholder'lari arasinda online sayisi ya da
#     isim listesi yoktur (standart modul sadece oyuncunun kendi
#     verisini verir), o yuzden bu panel bastan sona PAPI kullanir.
#
#     Isim satirlari PlayerList expansion ister:
#       /papi ecloud download PlayerList
#       /papi reload
#     Expansion yoksa 3-8 numarali satirlari sil; baslik satiri Server
#     expansion ile calismaya devam eder.
#
#     Kafa ikonu yok -> 'heads:' kullanmadim, cunku o skin texture ister.
# ---------------------------------------------------------------------
vanilla_playerlist:
  offset: LEFT
  align: LEFT
  texts:
    1:
      name: vanilla_font
      pattern: '<yellow><bold>OYUNCULAR <dark_gray>(<white>[papi:server_online]<dark_gray>/<white>[papi:server_max_players]<dark_gray>)'
      align: LEFT
      x: 0
      y: 0
    2:
      name: vanilla_font
      pattern: '<dark_gray>--------------------'
      align: LEFT
      x: 0
      y: 10
    3:
      name: vanilla_font
      pattern: '<white>[papi:playerlist_players_1]'
      align: LEFT
      x: 0
      y: 22
    4:
      name: vanilla_font
      pattern: '<white>[papi:playerlist_players_2]'
      align: LEFT
      x: 0
      y: 32
    5:
      name: vanilla_font
      pattern: '<white>[papi:playerlist_players_3]'
      align: LEFT
      x: 0
      y: 42
    6:
      name: vanilla_font
      pattern: '<white>[papi:playerlist_players_4]'
      align: LEFT
      x: 0
      y: 52
    7:
      name: vanilla_font
      pattern: '<white>[papi:playerlist_players_5]'
      align: LEFT
      x: 0
      y: 62
    8:
      name: vanilla_font
      pattern: '<white>[papi:playerlist_players_6]'
      align: LEFT
      x: 0
      y: 72


# ---------------------------------------------------------------------
#  3) ALT DURUM SATIRI  (hotbar ustu, ortali)
#     Can/aclik/zirh degerlerini SAYI olarak gosterir -- bar cizmez,
#     cunku bar cizmek PNG ister. Vanilla kalpler/etler zaten duruyor.
# ---------------------------------------------------------------------
vanilla_status:
  offset: CENTER
  align: CENTER
  texts:
    1:
      name: vanilla_font
      pattern: '<red>[health]<dark_gray>/<red>[max_health]   <gold>[food]<dark_gray>/<gold>20   <aqua>[armor]'
      align: CENTER
      number-format: '#'
      x: 0
      y: 0


# ---------------------------------------------------------------------
#  4) PARA GOSTERGESI  (sag ust kose)
# ---------------------------------------------------------------------
vanilla_economy:
  offset: RIGHT
  align: RIGHT
  texts:
    1:
      name: vanilla_font
      pattern: '<green>$[papi:vault_eco_balance_formatted]'
      align: RIGHT
      x: 0
      y: 0
