plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'java'
}

version = "${mod_version}"
group = "${mod_group_id}"

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

repositories {
    // Epic Fight is accessed purely via reflection at runtime, so it is NOT a
    // compile dependency and nothing needs to be placed in libs/. This flatDir
    // repo is kept only as a harmless hook if you later add optional jars.
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // NOTE: Epic Fight is intentionally NOT declared here. The bridge reaches
    // Epic Fight's classes through reflection (see EpicFightAccess), which is
    // why the mod compiles and loads even when Epic Fight is absent. If you
    // ever want compile-time access instead, drop the jar into libs/ and add:
    //   compileOnly fg.deobf(files('libs/epicfight-20.14.17.jar'))
}

// --- Optional BBS form type -------------------------------------------------
// Registering a form type inside BBS's own UI (the way Emoticons does) means
// subclassing BBS's `Form`, which reflection can't do. Those few classes live
// in src/bbsapi and are compiled ONLY when a BBS jar is in libs/ — drop
// bbs-mod-*.jar there to get them. Without it the build is unchanged and the
// mod simply skips the registration at runtime.
def bbsJars = fileTree('libs') { include 'bbs*.jar' }

if (!bbsJars.empty) {
    sourceSets {
        bbsapi {
            java.srcDir 'src/bbsapi/java'
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        }
    }
    dependencies {
        bbsapiCompileOnly bbsJars
    }
    tasks.named('jar', Jar).configure {
        from sourceSets.bbsapi.output
    }
    tasks.named('classes').configure { dependsOn 'bbsapiClasses' }
    logger.lifecycle("efmocap: building the BBS form type against ${bbsJars.files*.name}")
} else {
    logger.lifecycle('efmocap: no bbs*.jar in libs/ — skipping the BBS form type')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version, forge_version: forge_version,
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_authors: mod_authors, mod_license: mod_license,
        mod_group_id: mod_group_id
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
