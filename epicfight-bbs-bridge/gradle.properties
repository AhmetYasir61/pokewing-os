# Forge 1.20.1 build properties for the Epic Fight -> BBS animation bridge.
# Versions verified for the 1.20.1 modding line. Adjust the Forge patch
# number to whatever your dev environment / launcher uses.

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

minecraft_version=1.20.1
forge_version=47.3.0
mapping_channel=official
mapping_version=1.20.1

mod_id=efbbs
mod_name=Epic Fight -> BBS Bridge
mod_version=0.1.0
mod_group_id=com.pokewing.efbbs
mod_authors=pokewing
mod_license=MIT

# Epic Fight is used at compile time only (compileOnly). Point this at the
# Epic Fight jar you develop against. The mod loads fine at runtime WITHOUT
# Epic Fight present; the bridge simply reports that Epic Fight is missing.
epicfight_version=20.6.4
