# =====================================================================
#  plugins/BetterHud/texts/vanilla-font.yml
#
#  TEK font tanimi. Disaridan HICBIR .ttf / .png / .otf gelmiyor.
#
#  merge-default-bitmap: true
#     -> Minecraft'in KENDI ascii.png / accented.png / nonlatin_european.png
#        bitmap'lerini kullanir. Yani harfler birebir vanilla harfler.
#  use-unifont: true
#     -> Vanilla'nin unifont fallback'i (Turkce ç ğ ı ö ş ü dahil tum
#        karakterler icin). Bu da Mojang'in kendi verisi.
#  include: []
#     -> Ek karakter/glyph yok.
#
#  Sonuc: BetterHud'un urettigi pakette tek bir custom texture bulunmaz,
#  sadece vanilla glyph'lerin yeniden paketlenmis hali olur.
# =====================================================================

vanilla_font:
  # scale: BU SATIRI SILME.
  #
  # Glyph'lerin kac pikselde rasterize edilecegi. Varsayilani 16'dir ve
  # varsayilani birakirsan yazi TAM 2 KATI buyuk cikar.
  #
  # Nedeni: plugin'in kendi font.yml'inde (varsayilan font) 'scale: 16'
  # ile birlikte 8.0/scale oraninda bir kucultme uygulanir, yani 16 px
  # rasterize edilip 8 px cizilir. Ama texts/ altinda tanimladigin
  # fontlarda o bolme YOKTUR -- 16 px rasterize edilip 16 px cizilir.
  # 8 yazinca 8 px rasterize edilip 8 px cizilir = vanilla yazi boyu.
  scale: 8

  merge-default-bitmap: true
  use-unifont: true
  include: []
